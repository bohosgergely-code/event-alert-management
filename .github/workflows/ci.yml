name: CI

# The same commands that tools/verify.sh runs locally. The first run on GitHub passed.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/EventAlertManagement.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/EventAlertManagement.Web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  # The API describes itself, and the frontend's types are generated from that description.
  # This fails if someone changes the API without regenerating, so the two cannot drift apart unnoticed.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash tools/export-openapi.sh
      - run: npm run generate:api
        working-directory: src/EventAlertManagement.Web
      - run: git diff --exit-code -- docs/openapi.json src/EventAlertManagement.Web/src/app/core/api-schema.ts

