name: CI

# The same commands that tools/verify.sh runs locally. The first run on GitHub passed.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/EventAlertManagement.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/EventAlertManagement.Web/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
